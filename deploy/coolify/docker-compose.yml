# FacuTools — Docker Compose para Coolify
#
# En Coolify:
#   Build Pack: Docker Compose
#   Base Directory: /
#   Docker Compose Location: /deploy/coolify/docker-compose.yml
#
# Dominio: asignar solo al servicio "frontend" (puerto 80 del contenedor).
# El backend queda interno; nginx hace proxy de /api.
#
# Credenciales Postgres: definir en Coolify → Environment Variables
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB

name: facutools

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facutools}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify env}
      POSTGRES_DB: ${POSTGRES_DB:-facutools}
    volumes:
      - facutools-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facutools} -d ${POSTGRES_DB:-facutools}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-facutools}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-facutools}
    volumes:
      - facutools-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  facutools-data:
  facutools-pgdata:
