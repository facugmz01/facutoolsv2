# FacuTools — despliegue en TrueNAS SCALE (Custom App / docker compose)
#
# 1. Clonar el repo en FACUTOOLS_REPO (ver .env.example)
# 2. Crear el dataset FACUTOOLS_DATA y copiar .env.example → .env
# 3. Definir POSTGRES_PASSWORD en .env (obligatorio)
# 4. Desde este directorio: docker compose --env-file ... up -d --build

name: facutools

services:
  db:
    image: postgres:16-alpine
    container_name: facutools-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facutools}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-facutools}
    volumes:
      - ${FACUTOOLS_DATA}/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - facutools
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facutools} -d ${POSTGRES_DB:-facutools}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: facutools-redis
    command: redis-server --appendonly yes
    volumes:
      - ${FACUTOOLS_DATA}/redis:/data
    restart: unless-stopped
    networks:
      - facutools
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ${FACUTOOLS_REPO}/backend
      dockerfile: Dockerfile
    container_name: facutools-backend
    volumes:
      - ${FACUTOOLS_DATA}:/app/data
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-facutools}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-facutools}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CLIENT_SECRET_ENCRYPTION_KEY: ${CLIENT_SECRET_ENCRYPTION_KEY:?Set CLIENT_SECRET_ENCRYPTION_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - facutools
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ${FACUTOOLS_REPO}/frontend
      dockerfile: Dockerfile.prod
    container_name: facutools-frontend
    ports:
      - "${FACUTOOLS_HTTP_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - facutools

networks:
  facutools:
    driver: bridge
