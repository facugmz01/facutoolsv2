# Pegar en CloudPanel → Site → Nginx → Additional nginx directives
# (o el campo equivalente de configuración custom del vhost)
#
# Ajustá WEB_ROOT si tu htdocs no es el document root ya configurado.
# Si CloudPanel ya define root, omití la línea root y usá solo los location.

client_max_body_size 50m;

location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
}

# SPA: rutas del frontend → index.html
location / {
    try_files $uri $uri/ /index.html;
}
